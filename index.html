<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرد الآلي</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2a87d0);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --head: var(--tg-theme-section-header-text-color, var(--tg-theme-accent-text-color, #2a87d0));
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --field: color-mix(in srgb, var(--hint) 10%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--tg-theme-secondary-bg-color, #0f1115);
      --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1a1d23));
      --text: var(--tg-theme-text-color, #eceef2);
      --hint: var(--tg-theme-hint-color, #8b919c);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--tg-theme-secondary-bg-color, #0f1115);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1a1d23));
    --text: var(--tg-theme-text-color, #eceef2);
    --hint: var(--tg-theme-hint-color, #8b919c);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.55 "IBM Plex Sans Arabic", system-ui, sans-serif;
    padding: 12px 16px calc(96px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  h2 {
    font-size: 13px; font-weight: 600; color: var(--head);
    margin: 22px 4px 8px; letter-spacing: .2px;
  }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 50px;
  }
  .row:last-child { border-bottom: 0; }
  .row .sub { color: var(--hint); font-size: 13px; }
  .stack { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .stack:last-child { border-bottom: 0; }
  label.cap { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }
  .ltr { direction: ltr; text-align: left; }
  input.num { width: 92px; flex: none; text-align: center; direction: ltr; }
  .seg { display: flex; background: var(--field); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; font: inherit; font-size: 14px; border: 0; border-radius: 9px; padding: 8px 4px;
    background: transparent; color: var(--text); cursor: pointer;
  }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span {
    position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px #0003;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(-18px); }
  .call { padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .call:last-child { border-bottom: 0; }
  .call .top { display: flex; justify-content: space-between; gap: 8px; }
  .call .who { font-weight: 600; }
  .call .when { color: var(--hint); font-size: 13px; white-space: nowrap; }
  .call .sum { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-inline-start: 6px; font-weight: 500; }
  .tag.urgent { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .tag.spam { background: var(--field); color: var(--hint); }
  .more { display: block; width: 100%; font: inherit; color: var(--head); background: none; border: 0; padding: 12px; cursor: pointer; }
  .empty { text-align: center; color: var(--hint); padding: 48px 12px; }
  .stamp { color: var(--hint); font-size: 12px; text-align: center; margin-top: 18px; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h2::after { content: " ▾"; }
  .hidden { display: none !important; }
  .btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  .btn.alt { background: var(--field); color: var(--text); }
  .btn:disabled { opacity: .5; }
  .two { display: flex; gap: 8px; padding: 12px 14px; }
  .two .btn { flex: 1; }

  /* ---- call screen ---- */
  .callwrap { display: flex; flex-direction: column; min-height: calc(100vh - 120px); }
  .callhead { text-align: center; padding: 28px 8px 12px; }
  .callhead .nm { font-size: 24px; font-weight: 600; }
  .callhead .no { color: var(--hint); direction: ltr; margin-top: 2px; }
  .callhead .st { margin-top: 14px; font-size: 15px; color: var(--head); min-height: 24px; }
  .callhead .tm { color: var(--hint); font-variant-numeric: tabular-nums; direction: ltr; min-height: 22px; }
  .lines { flex: 1; overflow-y: auto; max-height: 42vh; padding: 4px 2px; }
  .ln { margin: 6px 0; padding: 8px 11px; border-radius: 12px; max-width: 86%; font-size: 14px; background: var(--card); }
  .ln.ai { margin-inline-start: auto; background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .ln .w { font-size: 11px; color: var(--hint); }
  .ctl { display: flex; justify-content: center; gap: 22px; padding: 12px 0 4px; }
  .rnd {
    width: 62px; height: 62px; border-radius: 50%; border: 0; font-size: 24px; cursor: pointer;
    background: var(--field); color: var(--text); display: grid; place-items: center;
  }
  .rnd[aria-pressed=true] { background: var(--text); color: var(--card); }
  .rnd.go { background: #22a559; color: #fff; width: 72px; height: 72px; font-size: 28px; }
  .rnd.end { background: #e5484d; color: #fff; width: 72px; height: 72px; font-size: 28px; }
  .rnd small { display: block; font-size: 10px; }
  .cap2 { text-align: center; color: var(--hint); font-size: 12px; margin-top: 4px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 10px auto 0; direction: ltr; }
  .keys button { font: inherit; font-size: 22px; padding: 10px 0; border: 0; border-radius: 12px; background: var(--card); color: var(--text); }
  .meter { height: 4px; border-radius: 2px; background: var(--field); margin: 10px auto 0; max-width: 200px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
</style>
</head>
<body>
<div id="app"><div class="empty">بيحمّل…</div></div>
<script>
  // Any failure is shown on the page, so a problem is never just a blank screen.
  function showError(msg) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="empty">حصلت مشكلة وأنا بفتح الإعدادات:<br><code style="direction:ltr;display:block;margin-top:8px;font-size:12px"></code></div>';
    app.querySelector('code').textContent = msg;
  }
  window.addEventListener('error', function (e) { showError(e.message + ' @' + (e.lineno || '?')); });
  window.addEventListener('unhandledrejection', function (e) { showError(String(e.reason)); });
</script>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
if (tg?.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;

const VOICES = {
  Charon: 'Charon — راجل، رزين', Puck: 'Puck — راجل، حيوي', Fenrir: 'Fenrir — راجل، قوي',
  Orus: 'Orus — راجل، هادي', Kore: 'Kore — ست، واضح', Aoede: 'Aoede — ست، ناعم',
  Leda: 'Leda — ست، شبابي', Zephyr: 'Zephyr — ست، مشرق',
  'local:sv': 'صوتي SV — على الموبايل', 'local:s': 'صوتي S — على الموبايل',
};
const LIST_KEYS = new Set(['spamNumbers']);

// Telegram replaces the link's #fragment with its own params, so the phone sends
// the data in ?d= instead, AES-GCM encrypted with a key that only this page (via
// Telegram CloudStorage) and the phone hold: the page's host only sees ciphertext.
const b64u = {
  dec: s => { const b = s.replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(b + '==='.slice((b.length + 3) % 4)), c => c.charCodeAt(0)); },
  enc: a => btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
};
// The key lives in Telegram CloudStorage (follows the account to every device);
// if that's unavailable or silent, this device's localStorage keeps it instead.
const withTimeout = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 4000))]);
const hasCloud = () => tg.isVersionAtLeast?.('6.9') && tg.CloudStorage;
const local = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const store = {
  async get(k) {
    if (hasCloud()) {
      try {
        const v = await withTimeout(new Promise((ok, no) => tg.CloudStorage.getItem(k, (e, v) => e ? no(new Error(e)) : ok(v || ''))));
        if (v) return v;
      } catch (e) { console.warn('cloud get', e); }
    }
    return local.get(k);
  },
  async set(k, v) {
    local.set(k, v);
    if (hasCloud()) {
      await withTimeout(new Promise((ok, no) => tg.CloudStorage.setItem(k, v, e => e ? no(new Error(e)) : ok())))
        .catch(e => console.warn('cloud set', e));
    }
  },
};
const VERSION = 'v5';
const diag = () => [VERSION, tg ? tg.platform + ' ' + tg.version : 'no tg', location.search ? 'd=' + (new URLSearchParams(location.search).get('d') || '').length : 'no d'].join(' · ');

async function decrypt(keyB64, d) {
  const raw = b64u.dec(d);
  const key = await crypto.subtle.importKey('raw', b64u.dec(keyB64), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
  return JSON.parse(pako.inflateRaw(new Uint8Array(plain), { to: 'string' }));
}

let data = null;
const app = document.getElementById('app');
const msg = (html) => { app.innerHTML = '<div class="empty">' + html + '</div><div class="stamp"></div>'; app.querySelector('.stamp').textContent = diag(); };

/** One tap: make a key, keep it in Telegram's cloud, and hand it to the phone. */
function linkScreen(text) {
  msg(text + '<br><br><button id="link" style="font:inherit;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:var(--accent-text);font-weight:600">🔗 اربط</button>');
  document.getElementById('link').onclick = async () => {
    const key = b64u.enc(crypto.getRandomValues(new Uint8Array(32)));
    await store.set('aca_key', key);
    tg.sendData(JSON.stringify({ link: key })); // closes; the phone answers with a new button
  };
}

(async () => {
  const q = new URLSearchParams(location.search);
  // Call screen opened in a normal browser (Telegram's mic didn't work): the key rides in #k=.
  const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (q.get('c') && hashKey) {
    history.replaceState(null, '', location.pathname + location.search); // keep the key out of history
    return callScreen(await decrypt(hashKey, q.get('c')), hashKey, q.get('c'));
  }
  // initData is empty for keyboard-button launches, so detect Telegram by its platform.
  if (!tg || tg.platform === 'unknown') return msg('افتح الصفحة دي من زرار «⚙️ الإعدادات» في البوت بتاعك.');
  const d = q.get('d');
  const key = await store.get('aca_key');
  if (q.get('c')) {
    if (!key) return linkScreen('اربط الصفحة بالموبايل الأول.');
    let call;
    try { call = await decrypt(key, q.get('c')); }
    catch (e) { return linkScreen('الزرار ده متربط بجهاز تاني. اربط تاني.'); }
    return callScreen(call, key, q.get('c'));
  }
  if (!key) return linkScreen('أول مرة؟ اربط الصفحة دي بالموبايل مرة واحدة.');
  if (!d) return linkScreen('الموبايل لسه مستلمش الربط. لو استنيت شوية ومفيش جديد، اربط تاني.');
  try { data = await decrypt(key, d); }
  catch (e) { return linkScreen('الزرار ده قديم أو متربط بجهاز تاني. اربط تاني.'); }
  render();
})().catch(e => showError(e.message || String(e)));

// ======================= call screen =======================
// The owner's voice on the phone's line. Audio and control go through the relay
// (relay/worker.js) as AES-GCM frames with the same key as the settings data:
// [type][body], type 1 = 40 ms of 16 kHz µ-law, type 2 = JSON. The relay only sees ciphertext.

const MU = {
  enc(f32) {
    const out = new Uint8Array(f32.length + 1); out[0] = 1;
    for (let i = 0; i < f32.length; i++) {
      let s = Math.max(-1, Math.min(1, f32[i])) * 32767 | 0;
      const sign = s < 0 ? 0x80 : 0; if (s < 0) s = -s;
      if (s > 32635) s = 32635;
      s += 0x84;
      let exp = 7, mask = 0x4000;
      while (exp > 0 && !(s & mask)) { exp--; mask >>= 1; }
      out[i + 1] = ~(sign | (exp << 4) | ((s >> (exp + 3)) & 0x0f)) & 0xff;
    }
    return out;
  },
  table: (() => {
    const t = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const u = ~i & 0xff, v = ((((u & 0x0f) << 3) + 0x84) << ((u & 0x70) >> 4));
      t[i] = ((u & 0x80) ? 0x84 - v : v - 0x84) / 32768;
    }
    return t;
  })(),
};

// Capture: mic at the context's rate → 16 kHz, posted in 640-sample (40 ms) frames.
// Play: 16 kHz frames → context rate, with a small jitter buffer (starts at 120 ms, caps at 500 ms).
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  constructor() { super(); this.r = sampleRate / 16000; this.t = -1; this.prev = 0; this.buf = new Float32Array(640); this.n = 0; this.peak = 0; }
  process(inputs) {
    const x = inputs[0] && inputs[0][0];
    if (!x) return true;
    while (this.t < x.length - 1) {
      const i = Math.floor(this.t), f = this.t - i;
      const a = i < 0 ? this.prev : x[i], b = x[i + 1];
      const v = a + (b - a) * f;
      this.buf[this.n++] = v;
      const m = v < 0 ? -v : v; if (m > this.peak) this.peak = m;
      if (this.n === 640) { this.port.postMessage({ pcm: this.buf, peak: this.peak }); this.buf = new Float32Array(640); this.n = 0; this.peak = 0; }
      this.t += this.r;
    }
    this.t -= x.length; this.prev = x[x.length - 1];
    return true;
  }
}
class Play extends AudioWorkletProcessor {
  constructor() {
    super(); this.step = 16000 / sampleRate; this.size = 32768; this.ring = new Float32Array(this.size);
    this.w = 0; this.r = 0; this.on = false;
    this.port.onmessage = e => {
      if (e.data === 'clear') { this.r = this.w; this.on = false; return; }
      const f = e.data;
      for (let i = 0; i < f.length; i++) this.ring[(this.w + i) % this.size] = f[i];
      this.w += f.length;
      if (this.w - this.r > 8000) this.r = this.w - 1920; // >500 ms behind: catch up
    };
  }
  process(_, outputs) {
    const out = outputs[0][0];
    for (let k = 0; k < out.length; k++) {
      const avail = this.w - this.r;
      if (!this.on && avail >= 1920) this.on = true;
      if (!this.on || avail < 2) { this.on = false; out[k] = 0; continue; }
      const i = Math.floor(this.r), f = this.r - i;
      const a = this.ring[i % this.size], b = this.ring[(i + 1) % this.size];
      out[k] = a + (b - a) * f;
      this.r += this.step;
    }
    for (let c = 1; c < outputs[0].length; c++) outputs[0][c].set(out);
    return true;
  }
}
registerProcessor('aca-cap', Cap);
registerProcessor('aca-play', Play);
`;

const STATES = {
  connecting: 'بيوصل للموبايل…',
  offline: 'الموبايل مش متصل دلوقتي — يمكن المكالمة خلصت',
  waiting: 'جاهز. دوس «اتصل» والموبايل هيتصل من خطك',
  dialing: 'بيتصل…',
  active: 'متصل — اتكلم',
  ai: 'الـ AI بيتكلم دلوقتي',
  ended: 'المكالمة خلصت',
  local: 'اتستلمت من الموبايل نفسه',
  cancelled: 'اتلغت',
  expired: 'الوقت خلص. ابعت الأمر تاني',
  failed: 'معرفش يتصل',
  busy: 'الخط مشغول بمكالمة تانية',
};
const FINAL = new Set(['ended', 'local', 'cancelled', 'expired', 'failed']);

async function callScreen(call, keyB64, sealed) {
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    n.append(...kids.flat().filter(k => k != null));
    return n;
  };
  tg?.disableVerticalSwipes?.();

  const key = await crypto.subtle.importKey('raw', b64u.dec(keyB64), 'AES-GCM', false, ['encrypt', 'decrypt']);
  const room = b64u.enc(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('aca-room:' + keyB64)))).slice(0, 22);
  const wsUrl = call.relay.replace(/\/+$/, '').replace(/^http/, 'ws') + '/ws?room=' + room + '&role=owner';

  // ---- UI ----
  const nameEl = el('div', { class: 'nm' }, call.name || call.number || 'مكالمة');
  const noEl = el('div', { class: 'no' }, call.name && call.name !== call.number ? call.number : '');
  const stEl = el('div', { class: 'st' }, STATES.connecting);
  const tmEl = el('div', { class: 'tm' });
  const meter = el('i');
  const lines = el('div', { class: 'lines' });
  const ctl = el('div', { class: 'ctl' });
  const extra = el('div');
  const hint = el('div', { class: 'cap2' });
  app.replaceChildren(el('div', { class: 'callwrap' },
    el('div', { class: 'callhead' }, nameEl, noEl, stEl, tmEl, el('div', { class: 'meter' }, meter)),
    lines, ctl, hint, extra));

  let state = 'connecting', since = 0, ws = null, phoneHere = false, done = false;
  let audio = null, muted = false, phoneMic = true, keysOpen = false;
  let sendChain = Promise.resolve(), recvChain = Promise.resolve();

  const send = obj => sendFrame(new Uint8Array([2, ...new TextEncoder().encode(JSON.stringify(obj))]));
  function sendFrame(plain) {
    sendChain = sendChain.then(async () => {
      if (!ws || ws.readyState !== 1) return;
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain));
      const f = new Uint8Array(12 + ct.length); f.set(iv); f.set(ct, 12);
      ws.send(f);
    }).catch(() => {});
  }

  function connect() {
    if (done) return;
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { send({ t: 'hello' }); setTimeout(() => { if (!phoneHere && !done) setState('offline'); }, 8000); };
    ws.onmessage = e => {
      if (typeof e.data === 'string') {
        let m; try { m = JSON.parse(e.data); } catch { return; }
        phoneHere = m.peer === 'up';
        if (phoneHere) send({ t: 'hello' }); else if (!done) setState('offline');
        return;
      }
      const raw = new Uint8Array(e.data);
      recvChain = recvChain.then(async () => {
        const p = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12)));
        if (p[0] === 1) { if (audio) audio.play(p); }
        else if (p[0] === 2) onControl(JSON.parse(new TextDecoder().decode(p.slice(1))));
      }).catch(() => {});
    };
    ws.onclose = () => { ws = null; if (!done) setTimeout(connect, 1500); };
  }

  function onControl(m) {
    if (m.t === 'state') {
      phoneHere = true;
      if (m.name || m.number) { nameEl.textContent = m.name || m.number; noEl.textContent = m.name && m.name !== m.number ? m.number : ''; }
      if (m.s === 'active' && state !== 'active') since = Date.now();
      setState(m.s);
    } else if (m.t === 'line') {
      lines.append(el('div', { class: 'ln ' + (m.who === 'ai' ? 'ai' : '') },
        el('div', { class: 'w' }, m.who === 'ai' ? 'الـ AI' : (call.name || 'هو')), m.text));
      lines.scrollTop = lines.scrollHeight;
    }
  }

  function setState(s) {
    state = s;
    stEl.textContent = STATES[s] || s;
    if (FINAL.has(s)) {
      done = true;
      stopAudio();
      tg?.disableClosingConfirmation?.();
      try { ws?.close(); } catch {}
    } else if (s === 'active' || s === 'dialing') tg?.enableClosingConfirmation?.();
    drawControls();
  }

  const btn = (cls, icon, label, onclick, pressed) => {
    const b = el('button', { class: 'rnd ' + cls, type: 'button', onclick }, icon);
    if (pressed != null) b.setAttribute('aria-pressed', String(pressed));
    return el('div', { style: 'text-align:center' }, b, el('div', { class: 'cap2' }, label));
  };

  function drawControls() {
    const live = state === 'active' || state === 'dialing';
    const row = [];
    if (state === 'waiting') row.push(btn('go', '📞', 'اتصل', () => start('dial')));
    if (state === 'ai') row.push(btn('go', '🎧', 'استلم المكالمة', () => start('takeover')));
    if (live) {
      row.push(btn('', muted ? '🔇' : '🎙️', muted ? 'المايك مقفول' : 'المايك', () => { muted = !muted; drawControls(); }, muted));
      row.push(btn('', '⌨️', 'الأرقام', () => { keysOpen = !keysOpen; drawControls(); }, keysOpen));
    }
    if (live || state === 'ai' || state === 'waiting') row.push(btn('end', '✕', state === 'waiting' ? 'إلغاء' : 'إنهاء', () => { send({ t: 'hangup' }); }));
    ctl.replaceChildren(...row);
    extra.replaceChildren();
    if (live && keysOpen) {
      extra.append(el('div', { class: 'keys' }, ...'123456789*0#'.split('').map(d =>
        el('button', { type: 'button', onclick: () => send({ t: 'dtmf', d }) }, d))));
    }
    if (live) {
      const t = el('input', { type: 'checkbox' }); t.checked = phoneMic;
      t.addEventListener('change', () => { phoneMic = t.checked; send({ t: 'phoneMic', on: phoneMic }); });
      extra.append(el('div', { class: 'row', style: 'margin-top:10px' },
        el('div', {}, el('div', {}, 'مايك الموبايل نفسه'), el('div', { class: 'sub' }, 'اقفله لو الموبايل في مكان فيه دوشة')),
        el('label', { class: 'switch' }, t, el('span'))));
    }
    hint.textContent = live ? 'السماعة أحسن عشان الطرف التاني ميسمعش صدى صوته' : '';
  }

  // ---- audio ----
  async function start(what) {
    try { audio = audio || await startAudio(); }
    catch (e) { return micFailed(e); }
    send({ t: what });
  }

  async function startAudio() {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
    const ctx = new AudioContext({ latencyHint: 'interactive' });
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
    await ctx.resume();
    const cap = new AudioWorkletNode(ctx, 'aca-cap');
    const play = new AudioWorkletNode(ctx, 'aca-play', { outputChannelCount: [2] });
    const sink = ctx.createGain(); sink.gain.value = 0;
    ctx.createMediaStreamSource(stream).connect(cap); cap.connect(sink); sink.connect(ctx.destination);
    play.connect(ctx.destination);
    cap.port.onmessage = e => {
      meter.style.width = Math.min(100, e.data.peak * 160) + '%';
      if (!muted && state === 'active' && phoneHere) sendFrame(MU.enc(e.data.pcm));
    };
    return {
      play(p) {
        const f = new Float32Array(p.length - 1);
        for (let i = 1; i < p.length; i++) f[i - 1] = MU.table[p[i]];
        play.port.postMessage(f, [f.buffer]);
      },
      stop() { stream.getTracks().forEach(t => t.stop()); ctx.close().catch(() => {}); },
    };
  }

  function stopAudio() { try { audio?.stop(); } catch {} audio = null; meter.style.width = '0'; }

  function micFailed(e) {
    console.warn('mic', e);
    const url = location.origin + location.pathname + '?c=' + sealed + '#k=' + keyB64;
    extra.replaceChildren(el('div', { class: 'card', style: 'margin-top:12px' },
      el('div', { class: 'stack' }, 'تليجرام مش مدّي الصفحة المايك (' + (e.name || e.message || e) + ').'),
      el('div', { class: 'two' },
        tg ? el('button', { class: 'btn', type: 'button', onclick: () => tg.openLink(url) }, 'افتحها في المتصفح') : null,
        el('button', { class: 'btn alt', type: 'button', onclick: () => start(state === 'ai' ? 'takeover' : 'dial') }, 'جرّب تاني'))));
  }

  setInterval(() => {
    if (state !== 'active' || !since) { tmEl.textContent = ''; return; }
    const s = Math.floor((Date.now() - since) / 1000);
    tmEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);

  drawControls();
  connect();
}

function render() {
  const orig = data.cfg;
  const cfg = JSON.parse(JSON.stringify(orig));
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    n.append(...kids.flat().filter(k => k != null));
    return n;
  };

  const changed = () => Object.keys(cfg).filter(k => JSON.stringify(cfg[k]) !== JSON.stringify(orig[k]));
  function set(k, v) { cfg[k] = v; refresh(); }

  // ---- field builders ----
  const text = (k, cap, opts = {}) => {
    const isList = LIST_KEYS.has(k);
    const val = isList ? (cfg[k] || []).join('\n') : (cfg[k] ?? '');
    const input = opts.long || isList
      ? el('textarea', { rows: opts.rows || 4, class: opts.ltr ? 'ltr' : '' }, val)
      : el('input', { type: 'text', value: val, class: opts.ltr ? 'ltr' : '' });
    input.addEventListener('input', () => {
      const v = input.value;
      set(k, isList ? v.split('\n').map(s => s.trim()).filter(Boolean) : v);
    });
    return el('div', { class: 'stack' }, el('label', { class: 'cap' }, cap), input,
      opts.hint ? el('div', { class: 'sub', style: 'margin-top:6px;color:var(--hint);font-size:13px' }, opts.hint) : null);
  };
  const toggle = (k, cap, sub) => {
    const input = el('input', { type: 'checkbox' });
    input.checked = cfg[k] !== false;
    input.addEventListener('change', () => { set(k, input.checked); rebuild(); });
    return el('div', { class: 'row' },
      el('div', {}, el('div', {}, cap), sub ? el('div', { class: 'sub' }, sub) : null),
      el('label', { class: 'switch' }, input, el('span')));
  };
  const number = (k, cap, unit, min, max) => {
    const input = el('input', { type: 'number', class: 'num', min, max, value: cfg[k] ?? '' });
    input.addEventListener('input', () => {
      const v = parseInt(input.value, 10);
      if (!Number.isNaN(v)) set(k, Math.min(max, Math.max(min, v)));
    });
    return el('div', { class: 'row' },
      el('div', {}, el('div', {}, cap), unit ? el('div', { class: 'sub' }, unit) : null), input);
  };
  const seg = (k, options, rebuildAfter) => {
    const wrap = el('div', { class: 'seg' });
    for (const [v, label] of options) {
      wrap.append(el('button', {
        type: 'button', 'aria-pressed': String(cfg[k] === v),
        onclick: () => { set(k, v); if (rebuildAfter) rebuild(); else wrap.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); },
        'data-v': v,
      }, label));
    }
    return el('div', { class: 'stack' }, wrap);
  };
  const select = (k, cap, options) => {
    const s = el('select', {}, Object.entries(options).map(([v, l]) => {
      const o = el('option', { value: v }, l); if (cfg[k] === v) o.selected = true; return o;
    }));
    s.addEventListener('change', () => set(k, s.value));
    return el('div', { class: 'stack' }, el('label', { class: 'cap' }, cap), s);
  };
  const section = (title, ...rows) => [el('h2', {}, title), el('div', { class: 'card' }, rows)];

  // ---- calls ----
  const fmt = new Intl.DateTimeFormat('ar-EG', { weekday: 'short', day: 'numeric', month: 'numeric', hour: 'numeric', minute: '2-digit' });
  let showAll = false;
  const callsCard = () => {
    const calls = data.calls || [];
    if (!calls.length) return el('div', { class: 'card' }, el('div', { class: 'empty', style: 'padding:20px' }, 'مفيش مكالمات لسه'));
    const list = (showAll ? calls : calls.slice(0, 4)).map(c => el('div', { class: 'call' },
      el('div', { class: 'top' },
        el('div', { class: 'who' }, c.n || 'رقم مخفي',
          c.u ? el('span', { class: 'tag urgent' }, 'مستعجل') : null,
          c.k === 'SPAM' ? el('span', { class: 'tag spam' }, 'سبام') : null),
        el('div', { class: 'when' }, fmt.format(new Date(c.t)))),
      c.s ? el('div', { class: 'sum' }, c.s) : null));
    const card = el('div', { class: 'card' }, list);
    if (calls.length > 4) card.append(el('button', { class: 'more', onclick: () => { showAll = !showAll; rebuild(); } }, showAll ? 'أقل' : `كل المكالمات (${calls.length})`));
    return card;
  };

  // ---- call from the phone's line ----
  const dialCard = () => {
    const to = el('input', { type: 'text', placeholder: 'رقم أو اسم من جهات الاتصال' });
    const note = el('textarea', { rows: 3, placeholder: 'للـ AI بس: يقوله إيه / عايز منه إيه' });
    const go = by => {
      const v = to.value.trim();
      if (!v) { to.focus(); return; }
      const payload = JSON.stringify({ call: { to: v, note: by === 'ai' ? note.value.trim() : '', by } });
      if (new TextEncoder().encode(payload).length > 4096) return tg.showAlert('التعليمات طويلة أوي.');
      tg.disableClosingConfirmation?.();
      tg.sendData(payload); // closes; the phone answers (with a call button for «أنا»)
    };
    return el('div', { class: 'card' },
      el('div', { class: 'stack' }, to),
      el('div', { class: 'stack' }, note),
      el('div', { class: 'two' },
        el('button', { class: 'btn', type: 'button', onclick: () => go('ai') }, '🤖 الـ AI يكلمه'),
        el('button', { class: 'btn alt', type: 'button', onclick: () => go('me') }, '🎧 أكلمه أنا')),
      (cfg.telegramControl || 'interval') !== 'always'
        ? el('div', { class: 'sub', style: 'padding:0 14px 12px;color:var(--hint);font-size:13px' }, 'الموبايل هيشوف الطلب في الفحص الجاي. خلي «التطبيق يشوف التغييرات» على «على طول» عشان يتصل في ساعتها.')
        : null);
  };

  // ---- page ----
  function rebuild() {
    const mode = cfg.mode || 'assistant';
    const ctl = cfg.telegramControl || 'interval';
    app.replaceChildren(
      ...section('الرد الآلي',
        toggle('enabled', 'شغال', 'لو مقفول الموبايل هيرن عادي'),
        seg('mode', [['assistant', 'مساعد'], ['persona', 'زيّي'], ['voicemail', 'رسالة']], true)),
      el('h2', {}, '📞 اتصل من خطك'), dialCard(),
      el('h2', {}, 'آخر المكالمات'), callsCard(),
      ...section('الكلام',
        text('ownerName', 'اسمك'),
        mode === 'assistant' ? text('greeting', 'أول جملة يقولها', { long: true, rows: 3, hint: '{owner} = اسمك' }) : null,
        mode === 'persona' ? text('personaGreeting', 'أول جملة يقولها (مود «زيّي»)', { long: true, rows: 3, hint: '{owner} = اسمك. المتسجلين بيتقالهم «أيوه يا <اسمه>».' }) : null,
        mode === 'persona' ? text('personaStyle', 'أسلوبك في الكلام', { long: true, rows: 4 }) : null,
        mode !== 'voicemail' ? text('aboutOwner', 'معلومات عنك', { long: true, rows: 6, hint: 'حاجات يقدر يجاوب بيها المتسجلين عندك بس' }) : null,
        mode !== 'voicemail' ? text('rules', 'قواعد ممنوع يكسرها', { long: true, rows: 5 }) : null,
        text('offlineGreeting', 'رسالة الرد الصوتي', { long: true, rows: 3, hint: 'بتتقال في مود «رسالة» أو لما النت يقع' }),
        toggle('announceRecording', 'يقول إن المكالمة بتتسجل', 'لو مقفول، مش هيجيب سيرة التسجيل (المكالمة لسه بتتسجل)'),
        select('voiceName', 'الصوت', VOICES),
        toggle('ownVoiceRvc', 'يتكلم بصوتي', 'صوت الذكاء الاصطناعي بيتحول لصوتك على الموبايل. لو مقفول، بيتكلم بالصوت العادي')),
      ...section('المكالمات',
        number('autoAnswerDelaySec', 'يرد بعد', 'ثانية رنين', 0, 60),
        mode === 'voicemail'
          ? number('voicemailMaxSec', 'أقصى مدة للرسالة', 'ثانية', 10, 600)
          : number('maxCallSec', 'أقصى مدة للمكالمة', 'ثانية', 30, 1800),
        number('repeatCallsForSpam', 'رقم غريب يتصل كام مرة يبقى سبام', null, 0, 20),
        text('spamNumbers', 'أرقام السبام', { ltr: true, rows: 3, hint: 'رقم في كل سطر' }),
        toggle('muteMicDuringCall', 'اقفل المايك أثناء المكالمة')),
      ...section('تليجرام',
        toggle('sendAudioOnMobileData', 'ابعت التسجيل على باقة الموبايل', 'لو مقفول، هيتبعت على الـ Wi-Fi بس'),
        toggle('dailyDigest', 'ملخص آخر اليوم', 'مين اتصل، المستعجل، ومواعيد بكره'),
        cfg.dailyDigest !== false ? number('digestHour', 'يتبعت الساعة', '0 – 23', 0, 23) : null,
        el('div', { class: 'stack' }, el('label', { class: 'cap' }, 'التطبيق يشوف التغييرات اللي بتحفظها هنا'),
          seg('telegramControl', [['interval', 'كل شوية'], ['always', 'على طول']], true).firstChild),
        ctl === 'interval' ? number('telegramPollMin', 'كل', 'دقيقة', 5, 120) : null,
        cfg.relayUrl ? toggle('remoteAlerts', 'نبّهني لما الـ AI يبقى في مكالمة', 'زرار تتابع بيه الكلام وتستلم المكالمة') : null),
      el('details', {},
        el('summary', {}, el('h2', {}, 'متقدم')),
        el('div', { class: 'card' },
          text('liveModel', 'Live model', { ltr: true }),
          text('textModel', 'Text model', { ltr: true }),
          text('transcribeModel', 'Transcribe model', { ltr: true }),
          text('ttsModel', 'TTS model', { ltr: true }),
          text('relayUrl', 'Relay URL', { ltr: true, hint: 'رابط الـ Worker عشان تتكلم من خطك عن طريق النت (فاضي = مقفول)' }))),
      el('div', { class: 'stamp' }, 'البيانات دي من ' + fmt.format(new Date(data.at))),
    );
  }

  // ---- save ----
  function refresh() {
    const n = changed().length;
    if (!tg) return;
    if (n) {
      tg.MainButton.setParams({ text: `احفظ (${n})`, is_visible: true, is_active: true });
      tg.enableClosingConfirmation?.();
    } else {
      tg.MainButton.hide();
      tg.disableClosingConfirmation?.();
    }
  }
  tg?.MainButton.onClick(() => {
    const keys = changed();
    if (!keys.length) return;
    const set = Object.fromEntries(keys.map(k => [k, cfg[k]]));
    const payload = JSON.stringify({ set });
    if (new TextEncoder().encode(payload).length > 4096) {
      tg.showAlert('التغييرات كتير على مرة واحدة. احفظ جزء وبعدين كمّل.');
      return;
    }
    tg.disableClosingConfirmation?.();
    tg.sendData(payload); // closes the Mini App; the phone applies it on its next check
  });

  rebuild();
  refresh();
}
</script>
</body>
</html>
